# Remote S override — existing Traefik + optional Postgres (ADR-0005).
# We do not ship Traefik. Usage:
#   docker compose -f deploy/compose.yml -f deploy/compose.server.yml \
#     --env-file deploy/.env --env-file deploy/.env.server up -d --build
#
# Postgres: set DATABASE_URL (and usually disable SQLite volume as SoT).
# Example URL: postgres://agent:agent@postgres:5432/agent_kernel

services:
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_kernel}
    volumes:
      - ak-pgdata:/var/lib/postgresql/data
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_kernel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_PATH: /data/agent-kernel.db
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      EXECUTOR_SSH_TUNNEL_TARGET: ${EXECUTOR_SSH_TUNNEL_TARGET:-}
      EXECUTOR_SSH_TUNNEL_ENDPOINT_HOST: ${EXECUTOR_SSH_TUNNEL_ENDPOINT_HOST:-host.docker.internal}
      EXECUTOR_SSH_TUNNEL_PORT_BASE: ${EXECUTOR_SSH_TUNNEL_PORT_BASE:-13100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.ak-api.rule=Host(`${API_HOST:?set API_HOST}`)
      - traefik.http.routers.ak-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ak-api.tls=true
      - traefik.http.routers.ak-api.tls.certresolver=${CERT_RESOLVER:-http_resolver}
      - traefik.http.services.ak-api.loadbalancer.server.port=8787
    networks:
      - default
      - proxy
    volumes:
      - ak-data:/data
      - ${WORKSPACE_ROOT}:/workspaces:rw
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  web:
    ports: !reset []
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE: ${VITE_API_BASE:?set VITE_API_BASE}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.ak-web.rule=Host(`${WEB_HOST:?set WEB_HOST}`)
      - traefik.http.routers.ak-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ak-web.tls=true
      - traefik.http.routers.ak-web.tls.certresolver=${CERT_RESOLVER:-http_resolver}
      - traefik.http.services.ak-web.loadbalancer.server.port=80
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  ak-pgdata:
