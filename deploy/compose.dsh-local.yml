# Local DeepSeek Harness (no Traefik) for agent-kernel ExecutorPort smoke.
# Build image from deepseek-harness repo first:
#   cd ~/Documents/Git/deepseek-harness && docker build -f deploy/Dockerfile -t dsh-web:local .
#
# Usage from agent-kernel:
#   mkdir -p /tmp/dsh-ws /tmp/dsh-data && cp ~/Documents/Git/deepseek-harness/deploy/settings.yaml /tmp/dsh-data/
#   docker compose -f deploy/compose.dsh-local.yml up

name: dsh-local

services:
  dsh:
    image: dsh-web:local
    ports:
      # Override with DSH_HOST_PORT if 13080 already taken (e.g. 13180).
      - "${DSH_HOST_PORT:-13080}:3080"
      - "${DSH_PREVIEW_PORT:-15173}:5173"
    environment:
      TRUSTED_HOST: localhost:${DSH_HOST_PORT:-13080}
      TRUSTED_HOST_PREVIEW: localhost:${DSH_PREVIEW_PORT:-15173}
    volumes:
      - ${DSH_WORKSPACE:-/tmp/dsh-ws}:/workspace
      - ${DSH_DATA:-/tmp/dsh-data}:/data
