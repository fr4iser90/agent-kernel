# Local L-docker — agent-kernel control plane
name: agent-kernel

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      PORT: "8787"
      DB_PATH: /data/agent-kernel.db
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspaces}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:8080}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      EXECUTOR_SSH_TUNNEL_TARGET: ${EXECUTOR_SSH_TUNNEL_TARGET:-}
      EXECUTOR_SSH_TUNNEL_ENDPOINT_HOST: ${EXECUTOR_SSH_TUNNEL_ENDPOINT_HOST:-host.docker.internal}
      EXECUTOR_SSH_TUNNEL_PORT_BASE: ${EXECUTOR_SSH_TUNNEL_PORT_BASE:-13100}
    volumes:
      - ak-data:/data
      - ${WORKSPACE_ROOT:-./workspaces}:/workspaces:rw
    ports:
      - "${API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Empty = same-origin via nginx /api proxy (local Docker)
        VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ak-data:
